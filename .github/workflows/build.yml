name: Build app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            mode: standalone
          - os: windows-latest
            python-version: "3.12"
            mode: standalone
          - os: macos-latest
            python-version: "3.12"
            mode: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: main.py
          mode: ${{ matrix.mode }}
          enable-plugins: pyqt5
          include-qt-plugins: platforms,styles,imageformats
          include-package: PyQt5
          include-package-data: matplotlib
          include-data-dir: vowspace/assets=vowspace/assets
          windows-icon-from-ico: vowspace/assets/vowspace.ico
          macos-app-icon: vowspace/assets/vowspace.icns
          macos-app-name: VowSpace
          macos-signed-app-name: com.alicagank.vowspace
          linux-icon: vowspace/assets/vowspace.png
          product-name: VowSpace
          output-file: VowSpace
          file-description: VowSpace
          output-dir: build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vowspace-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            build/**