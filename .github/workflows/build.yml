name: Build app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            extra: linux
          - os: windows-latest
            python-version: "3.12"
            extra: windows
          - os: macos-latest
            python-version: "3.12"
            extra: mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      # 🔹 Linux + Windows
      - name: Build (Linux/Windows)
        if: matrix.extra != 'mac'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: standalone
          enable-plugins: pyqt5
          include-qt-plugins: platforms,platformthemes,imageformats
          include-package: PyQt5
          include-package-data: matplotlib
          include-data-dir: vowspace/assets=vowspace/assets
          windows-icon-from-ico: vowspace/assets/vowspace.ico
          linux-icon: vowspace/assets/vowspace.png
          product-name: VowSpace
          output-file: VowSpace
          file-description: VowSpace
          file-version: 1.4.2
          product-version: 1.4.2
          output-dir: build

      # 🔹 macOS
      - name: Build (macOS)
        if: matrix.extra == 'mac'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: app
          enable-plugins: pyqt5
          include-qt-plugins: platforms,platformthemes,imageformats
          include-package: PyQt5
          include-package-data: matplotlib
          macos-app-icon: vowspace/assets/vowspace.icns
          macos-app-name: VowSpace
          macos-signed-app-name: com.alicagank.vowspace
          macos-app-version: 1.4.2
          product-name: VowSpace
          output-file: VowSpace
          file-description: VowSpace
          output-dir: build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }} Build
          path: |
            build/**
          include-hidden-files: true