name: Build app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            mode: standalone
          - os: windows-latest
            python-version: "3.12"
            mode: standalone
          - os: macos-latest
            python-version: "3.12"
            mode: app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build Executable (Linux/Windows)
        if: runner.os != 'macOS'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: ${{ matrix.mode }}
          enable-plugins: pyqt5
          include-qt-plugins: platforms,platformthemes,imageformats
          include-package: PyQt5
          include-package-data: matplotlib
          include-data-dir: vowspace/assets=vowspace/assets
          windows-icon-from-ico: vowspace/assets/vowspace.ico
          linux-icon: vowspace/assets/vowspace.png
          product-name: VowSpace
          output-file: VowSpace
          file-description: VowSpace
          file-version: 1.4.2
          product-version: 1.4.2
          output-dir: build

      - name: Build Executable (macOS)
        if: runner.os == 'macOS'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: ${{ matrix.mode }}
          enable-plugins: pyqt5
          include-qt-plugins: platforms,platformthemes,imageformats
          include-package: PyQt5
          include-package-data: matplotlib
          macos-app-icon: vowspace/assets/vowspace.icns
          macos-app-name: VowSpace
          macos-signed-app-name: com.alicagank.vowspace
          macos-app-version: 1.4.2
          product-name: VowSpace
          output-file: VowSpace
          file-description: VowSpace
          output-dir: build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }} Build
          path: |
            build/*.exe
            build/*.bin
            build/*.app/**/*
            build/*.dist/**/*
          include-hidden-files: true